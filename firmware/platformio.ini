; SMBusPeek – D1 mini als SBS-Master (USB-Serial-Bruecke)
;
; Hardware: hardware/SMBusPeek.kicad_sch
; SDA = GPIO4 (D2), SCL = GPIO5 (D1), 100 kHz, gemeinsame Masse mit dem Pack.

[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
build_unflags = -Wall
build_flags =
    -Wall
    -Wextra
    -D SBS_SDA_PIN=4
    -D SBS_SCL_PIN=5
